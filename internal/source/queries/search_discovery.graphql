query SearchDiscovery($query: String!, $cursor: String, $first: Int!) {
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
  search(query: $query, type: ISSUE, first: $first, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...DiscoveryFields
    }
  }
}
