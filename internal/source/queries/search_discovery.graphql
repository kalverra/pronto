query SearchDiscovery(
  $authored: String!
  $requested: String!
  $assigned: String!
  $direct: String!
  $first: Int!
) {
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
  authored: search(query: $authored, type: ISSUE, first: $first) {
    ...DiscoveryPage
  }
  requested: search(query: $requested, type: ISSUE, first: $first) {
    ...DiscoveryPage
  }
  assigned: search(query: $assigned, type: ISSUE, first: $first) {
    ...DiscoveryPage
  }
  # Subset of requested: only the IDs are needed to flag direct requests.
  direct: search(query: $direct, type: ISSUE, first: $first) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on PullRequest {
        id
      }
    }
  }
}
