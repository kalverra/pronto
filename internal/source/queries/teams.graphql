query ViewerTeams($login: String!) {
  viewer {
    organizations(first: 100) {
      pageInfo {
        hasNextPage
      }
      nodes {
        login
        teams(first: 100, userLogins: [$login]) {
          pageInfo {
            hasNextPage
          }
          nodes {
            slug
          }
        }
      }
    }
  }
}
