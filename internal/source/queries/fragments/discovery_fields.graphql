fragment DiscoveryFields on PullRequest {
  id
  state
  isInMergeQueue
  number
  title
  url
  isDraft
  updatedAt
  headRefName
  headRefOid
  baseRefName
  author {
    __typename
    login
  }
  repository {
    nameWithOwner
    defaultBranchRef {
      name
    }
  }
  stack {
    id
    number
    size
    baseRefName
  }
  stackEntry {
    id
    position
  }
  # Change fingerprint: CI rollup state moves without bumping updatedAt.
  # Aliased so it never collides with FreshFields when both are spread.
  fpLastCommit: commits(last: 1) {
    nodes {
      commit {
        statusCheckRollup {
          state
        }
      }
    }
  }
}
