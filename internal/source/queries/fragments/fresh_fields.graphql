fragment FreshFields on PullRequest {
  mergeable
  mergeStateStatus
  reviewDecision
  latestReviews(first: 20) {
    nodes {
      url
      author { login }
      state
      commit { oid }
      submittedAt
    }
  }
  timelineItems(itemTypes: [REVIEW_REQUESTED_EVENT], last: 20) {
    nodes {
      __typename
      ... on ReviewRequestedEvent {
        createdAt
        requestedReviewer {
          ... on User { login }
          ... on Team { slug organization { login } }
        }
      }
    }
  }
  baseRef {
    branchProtectionRule {
      requiredStatusCheckContexts
    }
  }
  commits(last: 1) {
    nodes {
      commit {
        oid
        committedDate
        ...StatusCheckRollupFields
      }
    }
  }
  mergeQueueEntry {
    position
    state
    enqueuedAt
    headCommit {
      oid
      ...StatusCheckRollupFields
    }
  }
}
