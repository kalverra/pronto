[tools]
go = "latest"
"go:actionlint.kjanat.dev/cmd/actionlint" = "latest"
golangci-lint = "latest"

betterleaks = "latest"
typos = "latest"
goreleaser = "latest"

[tasks]

[tasks.app]
description = "Run the application"
run = "go run ./cmd/pronto"

[tasks.debug]
description = "Run the application in debug mode"
run = "go run ./cmd/pronto --debug"

[tasks.test]
description = "Run all tests"
run = "go test ./... -timeout 30s -cover"

[tasks."test:pretty"]
description = "Run all tests with pretty output"
run = "go tool gotestsum -- ./... -timeout 30s -cover"

[tasks."test:find-slow"]
description = "Find slow tests"
run = "go test -json -count=1 ./... | go tool gotestsum tool slowest --threshold 200ms"

[tasks."test:thorough"]
description = "Run all tests many times to look for flakes"
run = "go test -count=100 -timeout 3m ./..."

[tasks."test:thorough:pretty"]
description = "Run all tests many times to look for flakes"
run = "go tool gotestsum -- ./... -count=100 -timeout 3m"

[tasks.race]
description = "Run all tests with -race"
run = "go test -count=5 -timeout 2m -race ./..."

[tasks."race:thorough"]
description = "Run all tests with -race many times"
run = "go test -count=50 -timeout 2m -race ./..."

[tasks."race:thorough:pretty"]
description = "Run all tests with -race many times"
run = "go tool gotestsum -- ./... -count=50 -timeout 2m -race"

[tasks.lint]
description = "Run full golangci-lint"
run = "golangci-lint run ./... --fix"

[tasks.generate]
description = "Run go generate"
run = "go generate ./..."

[tasks.bundle]
description = "Build and ad-hoc sign the native macOS notification helper app (dev build, no LaunchServices registration)"
run = "go run ./cmd/pronto notify setup --output build/ProntoNotify.app --force --no-register --bundle-id com.kalverra.pronto.notifier.dev"

[tasks."bundle:install"]
description = "Guided setup: install the native notification helper into ~/.local/share/pronto, register it, and authorize"
run = "go run ./cmd/pronto notify setup"

[tasks."bundle:smoke"]
description = "Post a test notification through the installed native helper"
run = "PRONTO_NOTIFICATIONS_MODE=native go run ./cmd/pronto notify --test"
