version: 2

builds:
  - id: pronto
    main: ./cmd/pronto
    binary: pronto
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - name_template: "pronto_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: pronto
    repository:
      owner: kalverra
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/kalverra/pronto"
    description: "PR triage dashboard and review queue"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pronto"]
          end

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
